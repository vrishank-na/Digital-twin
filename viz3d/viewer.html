<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Astronaut Twin Viewer</title>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
body{
    margin:0;
    background:#0b1020;
    color:white;
    font-family:Arial;
}
.topbar{
    padding:15px;
    display:flex;
    gap:15px;
    align-items:center;
}
model-viewer{
    transition: filter 0.6s ease;
    width:100%;
    height:85vh;
    background:linear-gradient(#10192f,#0b1020);
}
input[type=range]{
    width:300px;
}
</style>
</head>

<body>

<div class="topbar">
<h2>3D Astronaut Digital Twin</h2>
<span id="hourText">0h</span>
<span id="status">Nominal</span>
</div>

<model-viewer
id="astro"
src="astronaut.glb"
camera-controls
auto-rotate
shadow-intensity="1"
exposure="1"
></model-viewer>

<script>
const model = document.getElementById("astro");
const status = document.getElementById("status");
const hourText = document.getElementById("hourText");

function updateViewer(hour){

    hour = parseFloat(hour);
    hourText.innerText = hour.toFixed(1) + "h";

    if(hour < 8){
    status.innerText = "Launch Checkout";
    model.style.filter = "hue-rotate(180deg) brightness(0.95)";
}
else if(hour < 24){
    status.innerText = "Microgravity Adaptation";
    model.style.filter = "hue-rotate(220deg) brightness(1.0)";
}
else if(hour < 42){
    status.innerText = "Operations Block";
    model.style.filter = "hue-rotate(40deg) brightness(1.02)";
}
else if(hour < 54){
    status.innerText = "Recovery Cycle";
    model.style.filter = "hue-rotate(100deg) brightness(0.98)";
}
else if(hour < 64){
    status.innerText = "EVA Preparation";
    model.style.filter = "brightness(1.08) contrast(1.05)";
}
else{
    status.innerText = "Post-EVA Recovery";
    model.style.filter = "hue-rotate(300deg) brightness(0.97)";
}
}

window.addEventListener("message", function(event){
    if(event.data.missionHour !== undefined){
        updateViewer(event.data.missionHour);
    }
});
</script>

</body>
</html>
